import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// The version is the client's, from package.json; this host has none of its own.
// (Below the plugins block because Gradle allows no statement above it.)
def clientVersion = new JsonSlurper().parseText(file('../../../package.json').text).version
def (clientMajor, clientMinor, clientPatch) = clientVersion.tokenize('.').collect { it.toInteger() }
// major * 10000 + minor * 100 + patch, so the code rises with the version
// (Android compares only this integer). Holds until a minor or patch reaches 100.
def clientVersionCode = clientMajor * 10000 + clientMinor * 100 + clientPatch

android {
    namespace 'media.macha.client'
    compileSdk 36

    defaultConfig {
        applicationId 'media.macha.client'
        minSdk 26
        targetSdk 36
        versionCode clientVersionCode
        versionName clientVersion
    }

    sourceSets {
        main.assets.srcDirs += [file("$buildDir/generated/web")]
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('stageDeploymentApk', Copy) {
    dependsOn 'assembleDebug'
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into file('../../../artifacts')
    rename { "Macha-Android-TV-${clientVersion}-debug.apk" }
}
